name: History source archive
on:
  push:
    branches: [feat/healthkit-history]
    paths: [.github/workflows/history-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o /tmp/history-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: history-source
          path: /tmp/history-source.zip
          retention-days: 1
